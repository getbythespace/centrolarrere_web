# Especificación de despliegue para DigitalOcean App Platform.
#
# Se importa en la consola: Create → App → "Import from App Spec". Evita ir
# eligiendo opciones a mano y equivocarse en la que importa.
#
# Va como static_site y no como service: el proyecto usa `output: 'export'`, o
# sea que `npm run build` deja HTML suelto en out/ en vez de levantar un
# servidor. Los static sites de App Platform además no cuestan.
#
# Si el despliegue devuelve 404 en todas las rutas, el problema es casi siempre
# el output_dir: `next build` sin `output: export` produce .next/, que no es una
# carpeta de HTML y no se puede servir tal cual.
name: larrere

static_sites:
  - name: web
    github:
      repo: getbythespace/centrolarrere_web
      branch: main
      # Cada push a main vuelve a desplegar.
      deploy_on_push: true

    environment_slug: node-js
    build_command: npm run build
    # Acá está la carpeta que produce `output: 'export'`.
    output_dir: out

    # Sirve out/404.html cuando la ruta no existe, en vez de la página de error
    # genérica de DigitalOcean.
    catchall_document: 404.html

    envs:
      # Sin esto los enlaces canónicos y la vista previa al compartir apuntan a
      # localhost. Es el error más fácil de dejar pasar en un despliegue.
      #
      # Va en BUILD_TIME porque el sitio es estático: Next la incrusta en el HTML
      # al compilar y en producción ya no hay dónde leerla.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://larrere.cl
        scope: BUILD_TIME

      - key: TZ
        value: America/Santiago
        scope: BUILD_TIME

      # Cuando tengas el número del Pixel de Meta, va acá y se vuelve a
      # desplegar. También en BUILD_TIME, por lo mismo de arriba.
      # - key: NEXT_PUBLIC_META_PIXEL_ID
      #   value: "..."
      #   scope: BUILD_TIME

domains:
  - domain: larrere.cl
    type: PRIMARY
  - domain: www.larrere.cl
    type: ALIAS
